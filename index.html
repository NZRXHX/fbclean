<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NZR Facebook Reel Link Resolver</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0f172a;
            color: #e2e8f0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 35px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin: 0 0 10px;
            text-align: center;
            color: #ffffff;
            font-size: 28px;
        }

        .description {
            margin: 0 0 25px;
            text-align: center;
            color: #94a3b8;
            line-height: 1.6;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 1px solid #475569;
            border-radius: 9px;
            background: #0f172a;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #3b82f6;
        }

        input::placeholder {
            color: #64748b;
        }

        .resolve-button {
            padding: 14px 20px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .resolve-button:hover {
            background: #3b82f6;
        }

        .resolve-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #0f172a;
        }

        .result-title {
            margin-bottom: 10px;
            color: #4ade80;
            font-weight: bold;
        }

        .reel-link {
            display: block;
            padding: 13px;
            margin-bottom: 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #60a5fa;
            background: #1e293b;
            word-break: break-all;
            text-decoration: none;
        }

        .reel-link:hover {
            text-decoration: underline;
        }

        .copy-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #334155;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .copy-button:hover {
            background: #475569;
        }

        .error {
            color: #f87171;
            line-height: 1.5;
        }

        .loading {
            color: #94a3b8;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .input-wrapper {
                flex-direction: column;
            }

            .resolve-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Facebook Reel Link Resolver</h1>

    <p class="description">
        Paste a Facebook share link and get the direct Reel link.
    </p>

    <div class="input-wrapper">

        <input
            id="facebookUrl"
            type="url"
            placeholder="https://web.facebook.com/share/r/..."
            autocomplete="off"
        >

        <button
            id="resolveButton"
            class="resolve-button"
        >
            Resolve
        </button>

    </div>

    <div id="result"></div>

    <div class="footer">
        Facebook Share → Reel URL
    </div>

</div>

<script>

    /*
     * Your Cloudflare Worker
     */
    const WORKER_URL =
        "https://facebook-reel-resolver.nzrxhx.workers.dev/";

    const input = document.getElementById("facebookUrl");
    const resolveButton = document.getElementById("resolveButton");
    const result = document.getElementById("result");


    /*
     * Resolve when clicking the button
     */
    resolveButton.addEventListener("click", resolveReel);


    /*
     * Also allow pressing Enter
     */
    input.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            resolveReel();
        }

    });


    async function resolveReel() {

        const facebookUrl = input.value.trim();

        /*
         * Validate input
         */
        if (!facebookUrl) {

            showError("Please enter a Facebook share link.");

            return;
        }


        try {

            const parsedUrl = new URL(facebookUrl);

            const hostname = parsedUrl.hostname.toLowerCase();

            if (
                !hostname.endsWith("facebook.com") &&
                !hostname.endsWith("fb.watch")
            ) {

                showError("Please enter a valid Facebook URL.");

                return;
            }

        } catch {

            showError("The URL you entered is invalid.");

            return;
        }


        /*
         * Loading state
         */
        resolveButton.disabled = true;
        resolveButton.textContent = "Resolving...";

        result.style.display = "block";

        result.innerHTML = `
            <div class="loading">
                Resolving Facebook link...
            </div>
        `;


        try {

            /*
             * Send the Facebook URL to the Cloudflare Worker
             */
            const apiUrl =
                WORKER_URL +
                "?url=" +
                encodeURIComponent(facebookUrl);


            const response = await fetch(apiUrl);


            /*
             * Parse Worker response
             */
            const data = await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.error ||
                    "Unable to resolve the Facebook link."
                );

            }


            /*
             * Worker gives us something like:
             *
             * https://www.facebook.com/reel/906793715833527/?rdid=...
             *
             * We only want:
             *
             * https://www.facebook.com/reel/906793715833527/
             */
            const fullReelUrl = data.reelUrl;

            const reelUrl = extractCleanReelUrl(fullReelUrl);


            if (!reelUrl) {

                throw new Error(
                    "A Reel was found, but its ID could not be extracted."
                );

            }


            showResult(reelUrl);


        } catch (error) {

            console.error(error);

            showError(error.message);

        } finally {

            resolveButton.disabled = false;
            resolveButton.textContent = "Resolve";

        }

    }


    /*
     * Extract only:
     *
     * https://www.facebook.com/reel/123456789/
     *
     * from the complete redirect URL.
     */
    function extractCleanReelUrl(url) {

        try {

            const parsed = new URL(url);

            const match =
                parsed.pathname.match(
                    /^\/reel\/([0-9]+)\/?/
                );


            if (!match) {
                return null;
            }


            const reelId = match[1];


            return (
                "https://www.facebook.com/reel/" +
                reelId +
                "/"
            );

        } catch {

            return null;

        }

    }


    /*
     * Display successful result
     */
    function showResult(reelUrl) {

        result.style.display = "block";

        result.innerHTML = `
            <div class="result-title">
                ✓ Reel link found
            </div>

            <a
                id="reelLink"
                class="reel-link"
                href="${escapeHtml(reelUrl)}"
                target="_blank"
                rel="noopener noreferrer"
            >
                ${escapeHtml(reelUrl)}
            </a>

            <button
                id="copyButton"
                class="copy-button"
            >
                Copy Reel Link
            </button>
        `;


        document
            .getElementById("copyButton")
            .addEventListener("click", async function() {

                try {

                    await navigator.clipboard.writeText(reelUrl);

                    this.textContent = "✓ Copied!";

                    setTimeout(() => {

                        this.textContent = "Copy Reel Link";

                    }, 1500);

                } catch {

                    /*
                     * Fallback for browsers where Clipboard API
                     * is unavailable.
                     */
                    const textarea =
                        document.createElement("textarea");

                    textarea.value = reelUrl;

                    document.body.appendChild(textarea);

                    textarea.select();

                    document.execCommand("copy");

                    textarea.remove();

                    this.textContent = "✓ Copied!";

                    setTimeout(() => {

                        this.textContent = "Copy Reel Link";

                    }, 1500);

                }

            });

    }


    /*
     * Display error
     */
    function showError(message) {

        result.style.display = "block";

        result.innerHTML = `
            <div class="error">
                ✕ ${escapeHtml(message)}
            </div>
        `;

    }


    /*
     * Prevent HTML injection when displaying URLs/errors
     */
    function escapeHtml(value) {

        const div = document.createElement("div");

        div.textContent = value;

        return div.innerHTML;

    }

</script>

</body>
</html>
